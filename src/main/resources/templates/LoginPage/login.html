<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · seedkeeper</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/seedkeeper.css">
</head>
<body>
<header>
<strong>seedkeeper</strong>
</header>
<main data-page="login">
<h1>Log in</h1>
{#if failed}
<p role="alert">Wrong username or password.</p>
{#else if loggedOut}
<p role="status" id="logged-out">You are logged out.</p>
{/if}
<form method="post" action="/j_security_check">
<label>Username <input type="text" name="j_username" autocomplete="username" required autofocus></label>
<label>Password <input type="password" name="j_password" autocomplete="current-password" required></label>
<button type="submit">Log in</button>
</form>
</main>
</body>
</html>
