# Tests pick a free port, so a build never collides with something already listening.
quarkus.http.test-port=0
# A test that wants scheduled runs asks for them: no run starts by itself in the middle of another test.
%test.seedkeeper.schedule=0 0 6 1 1 ?

# Everything needs a login or an API key, also what is added later. Only the paths named here are open.
quarkus.http.auth.permission.open.paths=/login,/seedkeeper.css,/htmx.min.js,/q/health,/q/health/*,/q/metrics
quarkus.http.auth.permission.open.policy=permit
quarkus.http.auth.permission.protected.paths=/*
quarkus.http.auth.permission.protected.policy=authenticated

# Form login for the pages. The session cookie is encrypted with QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error
quarkus.http.auth.form.landing-page=/system

# The run history: SQLite in the data dir (spec §8). history/History migrates it at start, after it has made sure
# the data dir is there, so Flyway doesn't migrate on its own. Plain JDBC: no JTA, and no health check or metrics
# of the pool.
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${seedkeeper.data-dir:/data}/seedkeeper.db
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.health.enabled=false
quarkus.flyway.migrate-at-start=false
quarkus.datasource.devservices.enabled=false

# Production logs are JSON, one object per line. Dev mode and the tests keep the readable console format.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
