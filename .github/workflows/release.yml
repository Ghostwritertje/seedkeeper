name: Release

# Two ways to release X.Y.Z, both entirely in GitHub Actions:
# - Actions → Release → Run workflow on main, with the version (or `gh workflow run release.yml -f version=X.Y.Z`).
#   It releases the head of main, once CI has passed on that commit, and creates the tag vX.Y.Z itself.
# - Push a tag vX.Y.Z (or create a GitHub Release with a new tag, which pushes it).
# Either way the image is published first; the tag and the GitHub Release come after, so a release page never names
# an image that isn't there.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, X.Y.Z (the tag will be vX.Y.Z)'
        required: true
        type: string

permissions: {}

# One run per version at a time, whichever way it was started: a dispatch of X.Y.Z and the tag vX.Y.Z share a group
# (the input has no leading v). A running release is never cancelled. GitHub keeps one pending run per group, so a
# third run of the same version cancels the one waiting; releases of different versions don't touch each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ghostwritertje/seedkeeper

jobs:
  release:
    name: Build and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # Write to push the image; read also lists the image tags already published.
      packages: write
      # Reads the CI runs of the commit a release by hand takes.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the version from the tag or the input
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(.github/scripts/release-version.sh "$EVENT" "$REF" "$INPUT_VERSION")"
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
      - name: Check the tag is new and CI passed on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing="$(gh api "repos/$REPO/git/matching-refs/tags/$TAG" --jq "map(select(.ref == \"refs/tags/$TAG\")) | length")"
          if [ "$existing" != "0" ]; then
            echo "The tag $TAG exists already: pick a new version" >&2
            exit 1
          fi
          passed="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq '.total_count')"
          if [ "$passed" = "0" ]; then
            echo "CI has not passed on $GITHUB_SHA (the head of main) yet: wait for it, then run this again" >&2
            exit 1
          fi
      # A published X.Y.Z never changes: users pin it. Checked before the build, both ways a release starts, by asking
      # the registry for the manifest: 200 is published, 404 is not (also before the first release). Anything else
      # fails the run, so a token problem never lets a push through. No docker login: nothing holds the token while
      # the build runs, and curl reads it from stdin, not its arguments.
      - name: Check the image is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          repository="${IMAGE#ghcr.io/}"
          bearer="$(printf 'user = "%s:%s"\n' "$ACTOR" "$GH_TOKEN" \
            | curl -fsS -K - "https://ghcr.io/token?scope=repository:${repository}:pull,push" | jq -r '.token // empty')"
          if [ -z "$bearer" ]; then
            echo "ghcr.io gave no token for ${repository}: can't tell whether ${VERSION} is published already" >&2
            exit 1
          fi
          status="$(printf 'header = "Authorization: Bearer %s"\n' "$bearer" \
            | curl -sS -K - -o /dev/null -w '%{http_code}' -I \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${repository}/manifests/${VERSION}")"
          case "$status" in
            404) echo "${IMAGE}:${VERSION} is not published yet" ;;
            200)
              echo "${IMAGE}:${VERSION} is published already and is never overwritten. If an earlier run pushed it" \
                "and then failed, re-run only that run's failed jobs; otherwise pick a new version" >&2
              exit 1
              ;;
            *)
              echo "ghcr.io answered HTTP ${status} for ${IMAGE}:${VERSION}: can't tell whether it is published" >&2
              exit 1
              ;;
          esac
      # No Maven cache: a published image is built only from what Maven Central serves, never from a cache
      # another workflow run could have written.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - name: Set the project version (not committed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Build native and run the integration tests
        run: ./mvnw -B verify -Dnative
      - name: Build the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build --platform linux/amd64 \
            -f src/main/docker/Dockerfile.native-micro \
            --label "org.opencontainers.image.title=seedkeeper" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${VERSION}" .
      - name: Run the image as an arbitrary non-root user
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/smoke-test-image.sh "${IMAGE}:${VERSION}"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the exact version is pushed. There is no `latest`: consumers pin a version.
      - name: Push the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker push "${IMAGE}:${VERSION}"

  github-release:
    name: Tag and GitHub Release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job that can write to the repo, and it runs no build: it creates the tag and the release page.
    permissions:
      contents: write
    steps:
      # A tag created with this job's token starts no other workflow, so this run doesn't start itself again. When the
      # release was started by creating a GitHub Release, the page is there already and is left as it is.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The GitHub Release $TAG exists already"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
            --notes "Image: \`${IMAGE}:${VERSION}\`"
