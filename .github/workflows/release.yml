name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ghostwritertje/seedkeeper

jobs:
  release:
    name: Build and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not vX.Y.Z" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      # No Maven cache: a published image is built only from what Maven Central serves, never from a cache
      # another workflow run could have written.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - name: Set the project version (not committed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Build native and run the integration tests
        run: ./mvnw -B verify -Dnative
      - name: Build the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build --platform linux/amd64 \
            -f src/main/docker/Dockerfile.native-micro \
            --label "org.opencontainers.image.title=seedkeeper" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${VERSION}" .
      - name: Run the image as an arbitrary non-root user
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/smoke-test-image.sh "${IMAGE}:${VERSION}"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the exact version is pushed. There is no `latest`: consumers pin a version.
      - name: Push the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker push "${IMAGE}:${VERSION}"
