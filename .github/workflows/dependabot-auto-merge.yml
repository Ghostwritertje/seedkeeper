name: Dependabot auto-merge

# Turns on auto-merge for every Dependabot pull request. GitHub merges it once the
# checks the main ruleset requires (Verify (JVM), Verify (native)) pass; a failing
# check leaves the pull request open for a human.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Ghostwritertje/seedkeeper'
    steps:
      # Confirms the pull request really comes from Dependabot; fails otherwise.
      - uses: dependabot/fetch-metadata@v3
      # Squash keeps the linear history the ruleset requires.
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
