name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify

  quality:
    name: Verify (quality)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: PIT (#54) compares the changed classes against main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify -Pquality

  native:
    name: Verify (native)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # The native profile builds in the Mandrel builder container (pom.xml), so the runner
      # only needs a JDK and Docker. Runs the @QuarkusIntegrationTest classes against the executable.
      - run: ./mvnw -B verify -Dnative
      - name: Build the image
        run: docker build --platform linux/amd64 -f src/main/docker/Dockerfile.native-micro -t seedkeeper:ci .
      - name: Run the image as an arbitrary non-root user
        run: .github/scripts/smoke-test-image.sh seedkeeper:ci

  scripts:
    name: Test the CI scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each .github/scripts/*.test.sh is a table-driven shell test. They need only bash and jq: no Docker, no Maven.
      - run: for test in .github/scripts/*.test.sh; do "$test"; done
