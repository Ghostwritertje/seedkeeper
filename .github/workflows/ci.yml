name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify

  native:
    name: Verify (native)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # The native profile builds in the Mandrel builder container (pom.xml), so the runner
      # only needs a JDK and Docker. Runs the @QuarkusIntegrationTest classes against the executable.
      - run: ./mvnw -B verify -Dnative
      - name: Build the image
        run: docker build --platform linux/amd64 -f src/main/docker/Dockerfile.native-micro -t seedkeeper:ci .
      - name: Run the image as an arbitrary non-root user
        run: .github/scripts/smoke-test-image.sh seedkeeper:ci
