name: Address review feedback

# The implementer's fix path, called by implementer.yml for a pull request just labelled `ready-for-agent`, by a user
# with write access or by the reviewer App. The implementer addresses the pull request's unresolved review threads on
# the pull request's own branch, pushes, which starts a new review, and resolves the threads it handled. The label
# lifecycle: docs/agents/issue-tracker.md. Setting up the Apps, the secrets and the variables:
# docs/agents/github-apps.md. Why it runs this way: docs/adr/0001-agent-runner.md.

on:
  workflow_call:
    inputs:
      pull_request:
        description: The pull request whose review feedback to address.
        type: number
        required: true
      labeller:
        description: Who added `ready-for-agent`, a user or the reviewer App's bot.
        type: string
        required: true
    secrets:
      IMPLEMENTER_APP_ID:
        required: true
      IMPLEMENTER_APP_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # Deterministic checks before any agent runs: who labelled it, and whether the pull request can be worked on
  # (.github/scripts/pull-request-pick-up.sh). Only then swap the labels. One pick-up per pull request at a time, so
  # two labellings can't both start it: the second finds `ready-for-agent` gone.
  pick-up:
    name: Pick up the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: implementer-pick-up-${{ inputs.pull_request }}
      cancel-in-progress: false
    outputs:
      start: ${{ steps.check.outputs.start }}
      branch: ${{ steps.check.outputs.branch }}
      base: ${{ steps.check.outputs.base }}
    steps:
      # The scripts come from the base branch, so a pull request can't change how it is picked up.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Mint the implementer App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.IMPLEMENTER_APP_ID }}
          private-key: ${{ secrets.IMPLEMENTER_APP_KEY }}

      - name: Check the pull request can be worked on
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pull_request }}
          LABELLER: ${{ inputs.labeller }}
          REVIEWER: ${{ vars.REVIEWER_APP_SLUG }}[bot]
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Without REVIEWER_APP_SLUG, REVIEWER is "[bot]", which is nobody's login.
          if [ "$REVIEWER" != "[bot]" ] && [ "$LABELLER" = "$REVIEWER" ]; then
            echo "The reviewer App handed #$PR back."
          else
            if [ "$(gh api "repos/$GH_REPO/collaborators/$LABELLER/permission" | .github/scripts/write-access.sh)" != true ]; then
              echo "::notice::$LABELLER doesn't have write access: not starting."
              echo "start=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          pr="$(gh api "repos/$GH_REPO/pulls/$PR")"
          decision="$(.github/scripts/pull-request-pick-up.sh "$DEFAULT_BRANCH" <<<"$pr")"
          if [ "$decision" != start ]; then
            echo "::notice::Not starting on #$PR: ${decision#skip: }."
            echo "start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr edit "$PR" --remove-label ready-for-agent --add-label agent:in-progress
          {
            echo "start=true"
            echo "branch=$(jq -r .head.ref <<<"$pr")"
            echo "base=$(jq -r .base.ref <<<"$pr")"
          } >> "$GITHUB_OUTPUT"

  implement:
    name: Address the review feedback
    needs: pick-up
    if: needs.pick-up.outputs.start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per pull request, so several run in parallel. A run in progress is never cancelled; relabelling the
    # same pull request queues behind it.
    concurrency:
      group: implementer-pull-request-${{ inputs.pull_request }}
      cancel-in-progress: false
    steps:
      - name: Mint the implementer App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.IMPLEMENTER_APP_ID }}
          private-key: ${{ secrets.IMPLEMENTER_APP_KEY }}

      # The pull request's branch, with history. The action restores CLAUDE.md and .claude/, including the hook that
      # blocks native builds, from the base branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pick-up.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      # The prompt and the scripts come from the base branch, so a pull request can't rewrite its own implementer's
      # instructions. Only the pull request that adds them reads its own.
      - name: Read the prompt and the scripts
        id: prompt
        env:
          BASE_REF: ${{ needs.pick-up.outputs.base }}
        run: |
          for file in .github/prompts/implementer-fix.md .github/scripts/review-threads.sh; do
            git show "origin/$BASE_REF:$file" > "$RUNNER_TEMP/$(basename "$file")" 2>/dev/null \
              || cp "$file" "$RUNNER_TEMP/$(basename "$file")"
          done
          {
            echo 'text<<IMPLEMENTER_PROMPT_EOF'
            cat "$RUNNER_TEMP/implementer-fix.md"
            echo 'IMPLEMENTER_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # The unresolved review threads, as JSON the agent reads: these are what it addresses and the only threads it
      # can resolve.
      - name: List the unresolved review threads
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ inputs.pull_request }}
        run: |
          # shellcheck disable=SC2016 # the $ are GraphQL variables
          gh api graphql --paginate -F owner="$OWNER" -F repo="$REPO" -F number="$PR" -f query='
            query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      id isResolved isOutdated path line
                      comments(first: 100) { nodes { author { login } body } }
                    }
                  }
                }
              }
            }' | bash "$RUNNER_TEMP/review-threads.sh" unresolved > /tmp/review-threads.json
          echo "$(jq length /tmp/review-threads.json) unresolved review threads on #$PR."

      # As the Verify (JVM) job in ci.yml does.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The allowlist is exact: --permission-mode default denies whatever it doesn't list, and the denies are on the
      # command line so they also bind the action's own git scripts. Pushes go to the pull request's branch only.
      # allowed_bots lets the reviewer App's label start a run; the implementer App's own bot is listed because the
      # action also checks the pull request's author when a bot acts on it, and the implementer writes most of these
      # pull requests. Neither is a way in for other bots: implementer.yml only calls this for a user or the reviewer
      # App. restrict_untrusted_prs is off because the action counts every bot-authored pull request as untrusted and
      # would deny ./mvnw; forks never get here.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          base_branch: ${{ needs.pick-up.outputs.base }}
          allowed_bots: ${{ vars.REVIEWER_APP_SLUG }}[bot],${{ steps.app-token.outputs.app-slug }}[bot]
          restrict_untrusted_prs: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pull_request }}
            BRANCH: ${{ needs.pick-up.outputs.branch }}
            BASE: ${{ needs.pick-up.outputs.base }}
            REVIEW THREADS: /tmp/review-threads.json
            HANDLED THREADS: /tmp/handled-review-threads.txt

            ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 150
            --permission-mode default
            --allowedTools
            "Read,Glob,Grep,Edit,MultiEdit,Write,Agent,Skill,TodoWrite,Bash(./mvnw:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git branch --show-current),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git commit:*),Bash(git restore:*),Bash(git push origin ${{ needs.pick-up.outputs.branch }}),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment ${{ inputs.pull_request }}:*),Bash(gh pr edit ${{ inputs.pull_request }} --add-label needs-decision),Bash(gh pr edit ${{ inputs.pull_request }} --add-label agent:blocked)"
            --disallowedTools
            "Bash(gh pr merge:*),Bash(gh api:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git push * --force*),Bash(git push * -f*),Bash(git push *+*),Bash(git push --delete:*),Bash(git push * --delete*),Bash(git reset --hard:*),Bash(git rebase:*),Bash(./mvnw *-Dnative*),Bash(./mvnw *-Pnative*)"

      # Only threads that were unresolved when the run started, and that the agent listed as handled.
      - name: Resolve the handled review threads
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          handled=/tmp/handled-review-threads.txt
          [ -f "$handled" ] || { echo "The agent listed no handled threads."; exit 0; }
          # shellcheck disable=SC2016 # the $ are GraphQL variables
          bash "$RUNNER_TEMP/review-threads.sh" to-resolve /tmp/review-threads.json < "$handled" | while read -r id; do
            gh api graphql -F id="$id" -f query='
              mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' > /dev/null
            echo "Resolved $id."
          done

      # The fixes are pushed, or the agent labelled the pull request agent:blocked or needs-decision.
      - name: Clear agent:in-progress
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pull_request }}
        run: gh pr edit "$PR" --remove-label agent:in-progress

  # A crash, a timeout or an exhausted quota fails the job. Nothing retries on its own.
  blocked:
    name: Report a failed run
    needs: [pick-up, implement]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint the implementer App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.IMPLEMENTER_APP_ID }}
          private-key: ${{ secrets.IMPLEMENTER_APP_KEY }}
      - name: Label the pull request agent:blocked and link the run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pull_request }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr edit "$PR" --remove-label agent:in-progress --add-label agent:blocked
          gh pr comment "$PR" --body "The implementer agent failed: it crashed, timed out or ran out of quota. Nothing retries on its own. See the run: $RUN_URL

          To retry, remove \`agent:blocked\` and add \`ready-for-agent\`."
