name: Close auto-merged issues

# Closes the issues an auto-merged implementer pull request says it closes (#47). The `Auto-merge gate` in
# reviewer.yml turns on auto-merge with the workflow's own token, so GitHub merges as `github-actions[bot]`, and that
# merge doesn't close the pull request's `Closes #<n>` issues. It doesn't start any workflow either: not CI on `main`,
# not a `pull_request: closed` workflow. So this one runs on a schedule instead, and on Run workflow. It looks at the
# implementer pull requests merged in the last week, and for each one `github-actions` merged, comments on each open
# issue in its closingIssuesReferences, linking the pull request, and closes it as completed. Pull requests the
# maintainer merged are left alone: their merge closed the issues already.
#
# The comment has a marker, and an issue with the marker for that pull request is never closed again: an issue the
# maintainer reopens stays open. The close goes first, then the comment: a close that fails leaves no marker, so the
# next run tries again. A comment that fails leaves the issue closed without the link, and the run red.
#
# It closes with the workflow's own token, so the close starts no workflow, and an issue closed here starts no
# dependents, as ADR 0002 says (docs/adr/0002-auto-merge-policy.md). No pull request code is checked out or run: only
# .github/scripts from the default branch. The decision is .github/scripts/auto-merged-issues.sh, with its tests.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# bash -eo pipefail, not the default bash -e: a failed fetch at the head of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  close:
    name: Close the issues of auto-merged pull requests
    if: github.repository == 'Ghostwritertje/seedkeeper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Close them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMPLEMENTER: ${{ vars.IMPLEMENTER_APP_SLUG }}
        run: |
          if [ -z "$IMPLEMENTER" ]; then
            echo "::error::vars.IMPLEMENTER_APP_SLUG isn't set."
            exit 1
          fi
          since="$(date -u -d '7 days ago' +%F)"
          # GraphQL logins have no [bot]; the search author of an App is app/<slug>.
          # shellcheck disable=SC2016 # $q is a GraphQL variable, not a shell one.
          query='query($q: String!) {
            search(query: $q, type: ISSUE, first: 100) {
              nodes {
                ... on PullRequest {
                  number
                  author { login }
                  mergedBy { login }
                  closingIssuesReferences(first: 20) {
                    nodes {
                      number
                      state
                      repository { nameWithOwner }
                      comments(last: 100) { nodes { author { login } body } }
                    }
                  }
                }
              }
            }
          }'
          to_close="$(gh api graphql -f query="$query" \
            -f q="repo:$GH_REPO is:pr is:merged author:app/$IMPLEMENTER merged:>=$since" \
            | .github/scripts/auto-merged-issues.sh "$IMPLEMENTER" "$GH_REPO")"
          if [ -z "$to_close" ]; then
            echo "No open issues of auto-merged pull requests since $since."
            exit 0
          fi
          while read -r issue pr; do
            gh issue close "$issue" --reason completed </dev/null
            gh issue comment "$issue" --body "Closed by #$pr, which was auto-merged: an auto-merge doesn't close its issues on its own (#47).

          <!-- seedkeeper-auto-merge-closed: #$pr -->" </dev/null
            echo "::notice::Closed #$issue, fixed by the auto-merged #$pr."
          done <<<"$to_close"
